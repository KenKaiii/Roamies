# Builds the Windows installer (NSIS) on GitHub's runners and attaches it to the run as a download.
# For testing a fork: no signing keys, no release, no updater files. Run it from the Actions tab (Windows build,
# Run workflow); it also runs on pushes to local-ai-ollama. The .exe is under "Artifacts" on the finished run.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [local-ai-ollama]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: showcase/tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/tauri/sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: showcase/tauri/sidecar
        run: npm ci

      - name: Test sidecar
        working-directory: showcase/tauri/sidecar
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            showcase/tauri/src-tauri -> target
            showcase/tauri/src-tauri/voice-win -> target
            showcase/tauri/src-tauri/hands-win -> target
          key: x86_64-pc-windows-msvc

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Same NSIS prefetch as release.yml: the bundler's own download can time out.
      - name: Prefetch NSIS for the Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'tauri'; $tmp = Join-Path $env:RUNNER_TEMP 'nsis'
          New-Item -ItemType Directory -Force $dir, $tmp | Out-Null
          try {
            gh release download nsis-3.13 -R tauri-apps/binary-releases -p nsis-3.13.zip -D $tmp --clobber
            if ($LASTEXITCODE) { throw 'NSIS download failed' }
            gh release download nsis_tauri_utils-v0.5.3 -R tauri-apps/nsis-tauri-utils -p nsis_tauri_utils.dll -D $tmp --clobber
            if ($LASTEXITCODE) { throw 'nsis_tauri_utils download failed' }
            if ((Get-FileHash (Join-Path $tmp 'nsis-3.13.zip') -Algorithm SHA1).Hash -ne 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E') { throw 'NSIS hash mismatch' }
            if ((Get-FileHash (Join-Path $tmp 'nsis_tauri_utils.dll') -Algorithm SHA1).Hash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') { throw 'nsis_tauri_utils hash mismatch' }
            Remove-Item -Recurse -Force (Join-Path $dir 'NSIS'), (Join-Path $dir 'nsis-3.13') -ErrorAction SilentlyContinue
            Expand-Archive (Join-Path $tmp 'nsis-3.13.zip') -DestinationPath $dir
            Rename-Item (Join-Path $dir 'nsis-3.13') 'NSIS'
            $add = Join-Path $dir 'NSIS/Plugins/x86-unicode/additional'
            New-Item -ItemType Directory -Force $add | Out-Null
            Copy-Item (Join-Path $tmp 'nsis_tauri_utils.dll') $add
            Write-Host "NSIS ready in $dir"
          } catch { Write-Host "Couldn't prefetch NSIS ($_); the bundler will download it itself." }

      # createUpdaterArtifacts is off: signing update files needs the author's private key, and a fork build
      # shouldn't update itself from upstream anyway.
      - name: Build the installer
        env:
          TAURI_BUNDLES: nsis
        run: ./build.sh release --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: Roamies-windows-installer
          path: showcase/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
