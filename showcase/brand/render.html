<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Roamies brand art</title>
<style>
  body { margin: 0; padding: 32px; background: #0b0f10; color: #cfe9e4; font: 14px/1.4 ui-sans-serif, system-ui; }
  section { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 40px; }
  figure { margin: 0; display: grid; gap: 8px; justify-items: start; }
  canvas { background: #1d2224; border-radius: 6px; max-width: 100%; }
  a { color: #78ffe2; }
</style>
<body>
<h1>Roamies brand art</h1>
<p>Rendered live with the Sidekick's own LED renderer. Save each image and copy it into
<code>showcase/tauri/src-tauri/</code> as described in <code>showcase/brand/README.md</code>.</p>
<section id="icons"></section>
<section id="dmg"></section>
<script src="../roamies/core.js"></script>
<script src="../roamies/10-dither.js"></script>
<script src="brand.js"></script>
<script>
  const add = (where, can, name, w) => {
    const f = document.createElement('figure');
    can.style.width = (w ?? can.width) + 'px';
    const a = document.createElement('a');
    a.textContent = `Download ${name}`; a.download = name; a.href = can.toDataURL('image/png');
    f.append(can, a); document.getElementById(where).append(f);
  };
  add('icons', Brand.icon(1024), 'icon-1024.png', 256);
  for (const s of [256, 128, 64, 32, 16]) add('icons', Brand.icon(s), `icon-${s}.png`);
  add('dmg', Brand.dmg(1), 'dmg-background.png');
  add('dmg', Brand.dmg(2), 'dmg-background@2x.png', 660);
</script>
