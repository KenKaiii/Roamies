[package]
name = "roamies"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "macos-private-api"] }
serde_json = "=1.0.154"
global-hotkey = "=0.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
