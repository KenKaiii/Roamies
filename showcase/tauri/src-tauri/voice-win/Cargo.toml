# Voice helper for Roamies on Windows and Linux (the twin of voice/main.swift on macOS). Built by build.sh and
# bundled as binaries/roamies-voice-<target>[.exe]. Compiles on macOS too (no mic or hotkey there), so the
# transcription and the session logic can be tested anywhere.
[package]
name = "roamies-voice"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
parakeet-rs = "=0.4.3"
serde_json = "=1.0.154"
hound = "=3.5.1"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
cpal = "=0.18.2"

[target.'cfg(windows)'.dependencies]
png = "=0.18.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# The talk chord on X11 sessions (pure Rust, no system library).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "=0.13.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
